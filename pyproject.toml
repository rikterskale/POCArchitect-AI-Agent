[project]
name = "pocarchitect"
version = "0.2.0"
description = "POC Architect - AI Agent that turns raw PoC URLs into weaponized Markdown blueprints for red teamers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RikterSkale"}]
keywords = ["red-team", "pentesting", "poc", "exploit-development", "ai-agent", "offsec", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "typer==0.23.1",      # [all] brings shell completion support
    "click==8.3.3",
    "rich==15.0.0",
    "openai==3.1.0",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
all = []   # compatibility extra; core runtime features are included by default
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.9",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
pocarchitect = "pocarchitect.cli:app"

[project.urls]
Homepage = "https://github.com/rikterskale/POCArchitect-AI-Agent"
Repository = "https://github.com/rikterskale/POCArchitect-AI-Agent"
"Bug Tracker" = "https://github.com/rikterskale/POCArchitect-AI-Agent/issues"

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pocarchitect*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pocarchitect = ["*.md"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Typer's declarative option defaults intentionally use function calls; the
# remaining ignores document existing CLI/framework compatibility patterns.
ignore = ["B008", "BLE001", "PLW1510", "RUF100", "SIM102", "SIM103", "TRY002", "UP035", "UP045"]

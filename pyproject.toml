[project]
name = "pocarchitect"
version = "0.2.0"
description = "POC Architect - AI Agent that turns raw PoC URLs into weaponized Markdown blueprints for red teamers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "RikterSkale"}]
keywords = ["red-team", "pentesting", "poc", "exploit-development", "ai-agent", "offsec", "cybersecurity"]

dependencies = [
    "typer==0.23.1",      # [all] brings shell completion support
    "click==8.3.3",
    "rich==15.0.0",
    "openai==3.1.0",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
all = []   # compatibility extra; core runtime features are included by default

[project.scripts]
pocarchitect = "pocarchitect.cli:app"

[project.urls]
Homepage = "https://github.com/rikterskale/POCArchitect-AI-Agent"
Repository = "https://github.com/rikterskale/POCArchitect-AI-Agent"
"Bug Tracker" = "https://github.com/rikterskale/POCArchitect-AI-Agent/issues"

[tool.setuptools.packages.find]
include = ["pocarchitect*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pocarchitect = ["*.md"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

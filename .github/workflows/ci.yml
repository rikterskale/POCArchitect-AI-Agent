name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Black format check
        run: black --check --diff .

      - name: Mypy type check
        run: mypy pocarchitect tests

      - name: Documentation generation check
        run: python scripts/generate_docs.py --check

      - name: Novice guide validation
        run: python scripts/validate_novice_guides.py

      - name: Documentation link validation
        run: python scripts/validate_documentation_links.py

      - name: Selected documentation command validation
        run: python scripts/validate_documentation_commands.py

      - name: Documentation report validation
        run: python scripts/validate_documentation_reports.py

      - name: CI workflow invariant validation
        run: python scripts/validate_ci_workflow.py

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests with coverage
        run: pytest --cov=pocarchitect --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t pocarchitect:test .

      - name: Smoke test Docker image
        run: docker run --rm pocarchitect:test --help

  release-readiness:
    # New-user release readiness standard (docs/RELEASE_READINESS.md).
    # Not a coverage threshold: this proves a first-day user can install, be
    # guided through failures, exercise every feature, recover from mistakes,
    # and find accurate docs. The gate runs against a wheel installed into a
    # clean environment so it validates the shipped artifact, not the checkout.
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install from wheel into a clean environment (proven installation)
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install dist/*.whl

      - name: Enforce release readiness standard
        run: /tmp/fresh/bin/python scripts/release_readiness.py --format text

  build:
    needs: [quality, test, security, docker, release-readiness]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Validate packaged documentation links
        run: python scripts/validate_distribution.py dist

      - name: List built artifacts
        run: ls -la dist/

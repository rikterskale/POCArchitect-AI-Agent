name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Black format check
        run: black --check --diff .

      - name: Mypy type check
        run: mypy pocarchitect tests

      - name: Compile Python sources
        run: python -m compileall -q pocarchitect tests scripts

      - name: Documentation generation check
        run: python scripts/generate_docs.py --check

      - name: Novice guide validation
        run: python scripts/validate_novice_guides.py

      - name: Documentation link validation
        run: python scripts/validate_documentation_links.py

      - name: Selected documentation command validation
        run: python scripts/validate_documentation_commands.py

      - name: Documentation report validation
        run: python scripts/validate_documentation_reports.py

      - name: CI workflow invariant validation
        run: python scripts/validate_ci_workflow.py

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests with coverage
        run: pytest --cov=pocarchitect --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip install pip-audit
          pip install bandit

      - name: Dependency vulnerability scan
        run: pip-audit

      - name: Static security scan
        run: bandit -r pocarchitect -q

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t pocarchitect:test .

      - name: Smoke test Docker image
        run: docker run --rm pocarchitect:test --help

      - name: Smoke test Docker report persistence
        run: |
          docker volume create pocarchitect-smoke
          docker run --rm -v pocarchitect-smoke:/reports pocarchitect:test --format json --no-color demo
          docker run --rm --entrypoint python -v pocarchitect-smoke:/reports pocarchitect:test -c "from pathlib import Path; reports = list(Path('/reports/demo').glob('*.md')); assert reports, 'No demo report persisted in /reports'"

  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate packaged documentation links
        run: python scripts/validate_distribution.py dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  release-readiness:
    # New-user release readiness standard (docs/RELEASE_READINESS.md).
    # The matrix installs the built artifacts into disposable virtual
    # environments so source files and preinstalled runner packages cannot hide
    # packaging, entry-point, dependency, or platform defects.
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            artifact: wheel
          - os: ubuntu-latest
            python-version: "3.13"
            artifact: wheel
          - os: windows-latest
            python-version: "3.12"
            artifact: wheel
          - os: macos-latest
            python-version: "3.12"
            artifact: wheel
          - os: ubuntu-latest
            python-version: "3.12"
            artifact: sdist
    runs-on: ${{ matrix.os }}
    name: First run (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.artifact }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Exercise a clean first install
        run: python scripts/validate_fresh_install.py dist --artifact ${{ matrix.artifact }}

  build:
    needs: [quality, test, security, docker, package, release-readiness]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: List releasable artifacts
        run: ls -la dist/

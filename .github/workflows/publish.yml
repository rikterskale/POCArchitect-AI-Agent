name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate release distributions
        run: |
          python scripts/validate_distribution.py dist
          python -c "import pathlib, re, tomllib; tag='${{ github.event.release.tag_name }}'; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert tag == 'v'+version, f'{tag} does not match v{version}'"
      - name: Run the release readiness gate against the exact artifacts
        run: |
          python scripts/validate_fresh_install.py dist --artifact wheel
          python scripts/validate_fresh_install.py dist --artifact sdist
      - name: Upload release distributions for auditability
        uses: actions/upload-artifact@v4
        with:
          name: published-distributions
          path: dist/
          if-no-files-found: error
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

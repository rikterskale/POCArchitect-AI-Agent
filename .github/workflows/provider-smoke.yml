name: Opt-in provider smoke test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud provider to test
        required: true
        default: openai
        type: choice
        options:
          - openai
          - xai
          - groq
      model:
        description: Optional provider model override; leave blank for the project default
        required: false
        type: string

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install from the checkout
        run: python -m pip install .
      - name: Run one opt-in real provider request
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          args=(--url https://github.com/example/poc --provider "$PROVIDER" --no-ingest --yes --format json --no-color --output-dir .provider-smoke)
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          python -m pocarchitect "${args[@]}"
          test -n "$(find .provider-smoke -name '*.md' -print -quit)"

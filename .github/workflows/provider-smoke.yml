name: Opt-in provider smoke test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud provider to test, or all providers with configured secrets
        required: true
        default: openai
        type: choice
        options:
          - all
          - openai
          - xai
          - groq
      model:
        description: Optional provider model override; leave blank for the project default
        required: false
        type: string

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install from the checkout
        run: python -m pip install .
      - name: Run opt-in real provider request(s)
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          run_provider() {
            local provider="$1"
            local key_name="$2"
            if [ -z "${!key_name:-}" ]; then
              echo "Skipping $provider: $key_name is not configured."
              return 0
            fi
            local output_dir=".provider-smoke/$provider"
            local args=(--url https://github.com/example/poc --provider "$provider" --no-ingest --yes --format json --no-color --output-dir "$output_dir")
            if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
            python -m pocarchitect "${args[@]}"
            test -n "$(find "$output_dir" -name '*.md' -print -quit)"
          }
          if [ "$PROVIDER" = all ]; then
            run_provider openai OPENAI_API_KEY
            run_provider xai XAI_API_KEY
            run_provider groq GROQ_API_KEY
            test -n "$(find .provider-smoke -name '*.md' -print -quit)" || {
              echo "No provider secrets were configured; set at least one secret before selecting all."
              exit 2
            }
          else
            case "$PROVIDER" in
              openai) run_provider openai OPENAI_API_KEY ;;
              xai) run_provider xai XAI_API_KEY ;;
              groq) run_provider groq GROQ_API_KEY ;;
              *) echo "Unsupported provider: $PROVIDER"; exit 2 ;;
            esac
            test -n "$(find .provider-smoke -name '*.md' -print -quit)"
          fi
